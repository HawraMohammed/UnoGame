<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script type="module" src="./js/app.js" defer></script>
</head>

<body>

    <div class="player4 hidden"></div>
    <div class="horizontal">
        <div class="player3 hidden"></div>
        <div class="container2">
            <div class="playArea"></div>
            <div class="dock">
                <div class="card card1">
                </div>
                <div class="card card2">
                </div>
                <div class="card card3">
                </div>
                <div class="flipcard uno">
                    <div class="ovalflip">
                        <h1>UNO</h1>
                    </div>
                </div>
            </div>
        </div>

        <div class="player1"></div>
    </div>
    <div class="player2 hidden"></div>

    <div class="chooseColor hidden">
        <div id="message">
            <h1>Choose a color</h1>
        </div>
        <div class="colors">
            <div class="color"></div>
            <div class="color"></div>
            <div class="color"></div>
            <div class="color"></div>
        </div>
    </div>
    <div class="dashboard">
        <div class="dashcontainer">

            <div class="message">
                <h1> UNO </h1>
            </div>
            <div class="options">
                <div class="choice"><label>cards</label>
                    <input type="number" class="cardsNum" min="5" max="9" value="5">
                </div>
                <div class="choice"><label>players</label>
                    <input type="number" class="playersnum" min="2" max="4" value="2">
                </div>
            </div>
            <button class="play">Play</button>
        </div>

    </div>
</body>

</html>
